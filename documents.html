<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents · NZ Companion</title><link rel="stylesheet" href="styles.css"><style>
.docs-page{max-width:820px;margin:auto;padding:88px 18px 110px}.docs-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:18px}.docs-head h1{margin:3px 0}.docs-sub{color:var(--muted,#607080);margin:0}.doc-card{background:#fff;border:1px solid var(--line,#d9e1e4);border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 8px 24px rgba(25,55,70,.06)}.doc-card.is-pinned{border-width:2px}.doc-top{display:flex;gap:12px;align-items:flex-start}.doc-top h3{margin:3px 0 0;font-size:18px}.doc-top small{letter-spacing:.08em;text-transform:uppercase}.doc-icon{font-size:25px}.pin-btn{margin-left:auto;border:0;background:transparent;font-size:22px;padding:4px}.doc-card p{margin:12px 0}.doc-meta{font-size:12px;color:#607080}.doc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.pill{border:1px solid #cbd8dc;border-radius:999px;padding:9px 13px;background:#fff;color:inherit;text-decoration:none;font:inherit}.danger{color:#9a3f3f}.docs-add{border:0;border-radius:999px;padding:12px 16px;background:#087b98;color:#fff;font-weight:800}.docs-modal{display:none;position:fixed;inset:0;background:#0006;z-index:3000;align-items:flex-end;justify-content:center}.docs-modal.show{display:flex}.docs-sheet{width:min(100%,700px);max-height:90vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:22px}.docs-sheet label{display:block;font-weight:750;margin:13px 0 5px}.docs-sheet input,.docs-sheet select,.docs-sheet textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd7da;border-radius:14px;font:inherit}.docs-sheet textarea{min-height:80px}.checkline{display:flex!important;gap:9px;align-items:center}.checkline input{width:auto}.docs-close{float:right;border:0;background:none;font-size:26px}.docs-home-link{display:inline-block;margin-bottom:8px;text-decoration:none;color:inherit}.docs-note{background:#eef8f8;border-radius:16px;padding:12px 14px;font-size:13px}.empty-state{padding:30px;text-align:center;color:#607080}
</style></head><body><main class="docs-page"><a class="docs-home-link" href="index.html">‹ Home</a><div class="docs-head"><div><small>TRIP LIBRARY</small><h1>📎 Documents</h1><p class="docs-sub" id="docCount">Documents</p></div><button class="docs-add" onclick="openAddDocument()">＋ Upload</button></div><p class="docs-note">Useful things for the whole trip — insurance, parking information, vouchers, screenshots and anything else worth keeping handy.</p><section id="documentsList"></section></main><div class="docs-modal" id="docModal"><div class="docs-sheet"><button class="docs-close" onclick="closeAddDocument()">×</button><h2>Add document</h2><form id="docForm" onsubmit="event.preventDefault();saveDocument()"><label>File / photo</label><input id="docFile" type="file" accept="image/*,.pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required><label>Title</label><input id="docTitle" placeholder="e.g. Queenstown parking map"><label>Category</label><select id="docCategory"><option>Insurance</option><option>Driving & Parking</option><option>Bookings & vouchers</option><option>Travel Documents</option><option>Reference</option><option selected>Other</option></select><label>Link to</label><select id="docLink"></select><label>Note</label><textarea id="docNote" placeholder="Optional short note"></textarea><label class="checkline"><input id="docPin" type="checkbox"> Pin this document</label><button class="docs-add" id="docSave" type="submit">Save Document</button></form></div></div><script src="trip-config.js"></script><script src="storage-config.js"></script><script src="storage.js"></script><script src="sync-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client-runtime.js"></script><script src="data.js"></script><script src="documents-runtime.js"></script><script src="documents.js"></script></body></html>
